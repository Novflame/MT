[package]
name = "taseety-desktop"
version = "1.0.0"
description = "TASEETY school management desktop client"
authors = ["TASEETY"]
edition = "2021"

[lib]
name = "taseety_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
